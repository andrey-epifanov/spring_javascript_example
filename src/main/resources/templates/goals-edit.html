<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование Целей</title>
    <link rel="stylesheet" th:href="@{/styles/main.css}">
</head>
<body>
<div class="container">
    <h1>Редактирование Целей</h1>
    <p class="subtitle">Номер — два уровня через точку (1, 1.1, 1.2…). Сортировка по клику на заголовок №.</p>

    <p class="page-nav">
        <a th:href="@{/goals}">← Цели</a>
        <span> · </span>
        <a th:href="@{/}">Организационная структура</a>
    </p>

    <div class="toolbar">
        <button type="button" id="addGoalBtn">Добавить</button>
        <button type="button" id="saveGoalsBtn" class="secondary">Сохранить все</button>
        <span id="goalStatusText" class="status"></span>
    </div>

    <div class="card">
        <table class="goal-table">
            <thead>
            <tr>
                <th class="position-col sortable" id="positionHeader" data-type="table" data-sort="position" data-tbody="goal-body"
                    title="Двухуровневая сортировка: клик переключает 4 режима">
                    № <span class="sort-arrow"></span>
                </th>
                <th>Измерено</th>
                <th>Текущее</th>
                <th>Ответственный</th>
                <th>Статус</th>
            </tr>
            </thead>
            <tbody id="goal-body">
            <tr th:each="goal : ${goals}" data-position="${goal.position}">
                <td><input type="text" name="position" th:value="${goal.position}" class="position-input"></td>
                <td><input type="text" name="measured" th:value="${goal.measured}" class="goal-input"></td>
                <td><input type="text" name="currentValue" th:value="${goal.currentValue}" class="goal-input"></td>
                <td><input type="text" name="responsible" th:value="${goal.responsible}" class="goal-input"></td>
                <td>
                    <select name="status" class="goal-input">
                        <option th:each="status : ${goalStatuses}" th:value="${status}" th:text="${status}"
                                th:selected="${status == goal.status}">status</option>
                    </select>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script th:inline="javascript">
    // Статусы целей с бэкенда (EnumHelpController → @ModelAttribute goalStatuses).
    // Объявляем до module-скрипта, чтобы goals-edit.js гарантированно их увидел.
    window.__GOAL_STATUSES__ = /*[[${goalStatuses}]]*/ ['В работе', 'Выполнено', 'На паузе', 'Просрочено'];
</script>
<script type="module" th:src="@{/scripts/goals-edit.js}"></script>
</body>
</html>
