<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Организационная структура</title>
    <link rel="stylesheet" th:href="@{/styles/main.css}">
</head>
<body>
<div class="container">
    <h1>Организационная структура</h1>
    <p class="subtitle">Иерархия «начальник — подчинённый», данные загружаются через REST API</p>

    <div class="toolbar">
        <input type="text" id="nameFilterInput" class="filter-control" placeholder="Фильтр по имени и фамилии">
        <select id="departmentFilterSelect" class="filter-control" aria-label="Фильтр по отделу">
            <option value="">Все отделы</option>
        </select>
        <select id="positionFilterSelect" class="filter-control" aria-label="Фильтр по должности">
            <option value="">Все должности</option>
        </select>
        <button type="button" id="expandAllBtn">Развернуть всё</button>
        <button type="button" id="collapseAllBtn" class="secondary">Свернуть всё</button>
        <button type="button" id="reloadBtn" class="secondary">Обновить</button>
    </div>

    <div class="card">
        <table>
            <thead>
            <tr>
                <th>Сотрудник</th>
                <th>Должность</th>
                <th>Отдел</th>
                <th>Уровень</th>
            </tr>
            </thead>
            <tbody id="employeeTableBody">
            <tr>
                <td colspan="4">Загрузка данных...</td>
            </tr>
            </tbody>
        </table>
    </div>

    <p class="status" id="statusText"></p>
</div>

<script type="module" th:inline="javascript">
    const employeeModuleUrl = /*[[@{/scripts/javascrip1.js}]]*/ '/scripts/javascrip1.js';

    import(employeeModuleUrl).then(({expandAll, collapseAll}) => {
        document.getElementById('expandAllBtn').addEventListener('click', expandAll);
        document.getElementById('collapseAllBtn').addEventListener('click', collapseAll);
    });
</script>

</body>
</html>
